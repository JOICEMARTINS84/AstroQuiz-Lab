or:#8e75e9}.option:not(:disabled):active{transform:scale(.99)}.letter{flex:0 0 33px;display:grid;place-items:center;border-radius:9px;height:33px;background:#eeebf8;color:#6349bd;font-weight:800;font-size:14px}.option.good{background:#ebf9f1;border-color:#77c39a;color:#176640;animation:pop .25s ease}.option.bad{background:#fff0ef;border-color:#e69c9b;color:#9a3941;animation:shake .35s ease}.option.selected{background:#f0eaff;border-color:#9077e8}.option.dim{opacity:.68}.feedback{margin-top:14px;padding:16px;border-radius:12px;background:#f3f0fb;font-size:15px;line-height:1.5;animation:enter .3s ease}.feedback strong{display:block;margin-bottom:6px}.primary{display:block;margin-top:17px;border:0;background:#6246c9;color:#fff;width:100%;min-height:52px;padding:12px 20px;border-radius:12px;font-weight:800;transition:background .15s,transform .15s}.primary:hover{background:#4f34b0;transform:translateY(-1px)}.small{font-size:13px;color:#777387}.score{font-weight:800;color:#6246c9;font-size:14px}.intro{position:relative;isolation:isolate;overflow:hidden;text-align:center;border-radius:22px;padding:25px 20px 32px;background:radial-gradient(ellipse at 50% 70%,#39305e,#17182b 70%);color:#fff}.intro h1{font-size:clamp(28px,6vw,42px);letter-spacing:-.05em;margin:12px 0}.intro p{color:#ded8f1;line-height:1.6;max-width:480px;margin:0 auto 16px}.intro .primary{max-width:400px;margin:20px auto 0;background:#a18aef;color:#17162a}.orbital{width:144px;height:144px;border:1px solid #8b7caf80;border-radius:50%;margin:0 auto;display:grid;place-items:center;position:relative}.planet{width:79px;height:79px;border-radius:100%;background:radial-gradient(circle at 30% 25%,#f8d7a9,#bb88b8 50%,#564578 87%);box-shadow:0 0 40px #ab82db65;animation:float 3.4s ease-in-out infinite}.satellite{position:absolute;inset:-1px;animation:orbit 5s linear infinite}.satellite:after{content:"";position:absolute;top:0;left:50%;width:11px;height:11px;background:#e9d9ff;box-shadow:0 0 13px #e2caff;border-radius: @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes pop{0%{transform:scale(.94);opacity:.65}100%{transform:scale(1);opacity:1}}@keyframes pulse{from{opacity:.65}to{opacity:1}}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}@keyframes float{50%{transform:translateY(-5px)}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(.1);opacity:0}}@media(max-width:470px){.game{border-radius:16px}.option{padding:11px 12px;gap:9px;min-height:57px}.letter{flex-basis:27px;height:28px}.time{font-size:24px}.top{margin-bottom:14px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* Retro arcade HUD */
body{font-family:system-ui,Arial,sans-serif;color:#e3f4ff}
.game{background:linear-gradient(155deg,#070e23f7,#111139f4);border:2px solid #528de1;border-radius:6px;box-shadow:inset 0 0 0 4px #060b20,inset 0 0 42px #22327755;padding:clamp(13px,3vw,26px)}
.game:before{background:repeating-linear-gradient(0deg,transparent 0 3px,#02071a22 3px 4px),radial-gradient(ellipse at 80% 20%,#4a2a9650,transparent 42%);z-index:0}
.top,.footer,.time,.score,.tag,.count,.letter,.sound,.intro h1,.primary{font-family:Consolas,'Courier New',monospace}
.top{border-bottom:1px solid #365897;padding:0 0 12px;margin-bottom:17px}
.tag{letter-spacing:.11em;color:#80efff;text-shadow:0 0 8px #4ed5ff99;font-weight:900}
.sound{border-radius:4px;font-size:12px;background:#0b1f3c;border:1px solid #4891bd}
.steps i{border-radius:1px;height:7px;box-shadow:inset 0 0 0 1px #3b5087}
.steps .correct,.steps .done{box-shadow:0 0 9px #43dcae55}.steps .current{box-shadow:0 0 10px #57d6ff88}
.meter{padding:9px;border:1px solid #304f8a;background:#060d20;border-radius:4px}
.rail{border-radius:2px;border:1px solid #304f8a;height:15px;background:#132241}
.fill{border-radius:1px;background:repeating-linear-gradient(90deg,#30c8f6 0 10px,#6ee6ff 10px 11px,#1a6493 11px 13px);box-shadow:0 0 12px #4be2ff}
.urgent .fill{background:repeating-linear-gradient(90deg,#f1716b 0 10px,#ffad79 10px 11px,#833d58 11px 13px)}
.time{font-size:30px;font-weight:900;color:#a0f7ff;text-shadow:0 0 12px #36cfff88;letter-spacing:-.06em}
.question h2{color:#f1f7ff;text-shadow:0 2px 5px #020615;line-height:1.34}
.option{border-radius:4px;border-width:2px;border-color:#304c86;box-shadow:inset 0 0 17px #06142f;background:linear-gradient(135deg,#101f3e,#121631)}
.option:not(:disabled):hover{transform:translateX(4px);border-color:#81e4ff;box-shadow:inset 0 0 15px #274f8866,0 0 14px #37ccff50}
.letter{border-radius:3px;font-size:19px;background:#082a46;color:#92efff;text-shadow:0 0 9px #79ecff77}
.option.good{border-color:#5cffb9;box-shadow:0 0 15px #3fe8aa44,inset 0 0 18px #1b735544}
.option.bad{border-color:#ff7495;box-shadow:0 0 15px #ff749544,inset 0 0 18px #9c395544}
.feedback,.intro{border-radius:4px}.feedback strong{font-family:Consolas,'Courier New',monospace;color:#94eaff}
.primary,.intro .primary{border-radius:4px;border-width:2px;border-color:#8defff;box-shadow:0 4px 0 #163868,0 0 21px #635cff50;letter-spacing:.07em;font-weight:900}
.primary:active{transform:translateY(3px);box-shadow:none}
.intro{min-height:345px;background:radial-gradient(ellipse at 50% 45%,#2f286f,#050b21 75%);border:1px solid #4169a8}
.intro h1{text-transform:uppercase;font-size:clamp(26px,5vw,40px);letter-spacing:-.055em;text-shadow:3px 3px 0 #5d3bb3,0 0 30px #79eaff80}
.orbital{background:radial-gradient(circle,#432f6766,transparent 70%);border-style:dashed}.planet{box-shadow:0 0 45px #a18cf488}
.arcade-ship{position:absolute;top:50%;left:50%;width:36px;height:45px;margin:-22px -18px;background:linear-gradient(90deg,#7754cb,#baf2ff,#654eb1);clip-path:polygon(50% 0,68% 37%,100% 79%,65% 66%,50% 100%,35% 66%,0 79%,32% 37%);filter:drop-shadow(0 0 6px #64f2ff);animation:shipOrbit 5s linear infinite}
@keyframes shipOrbit{from{transform:rotate(0deg) translateY(-77px) rotate(90deg)}to{transform:rotate(360deg) translateY(-77px) rotate(90deg)}}
.hud-stars{position:absolute!important;inset:0;overflow:hidden;pointer-events:none;z-index:0!important;opacity:.65;background-image:radial-gradient(circle,#c0edff 1px,transparent 1.5px),radial-gradient(circle,#c4b4ff 1px,transparent 1.4px);background-size:79px 97px,43px 67px;background-position:0 0,13px 15px;animation:spaceScroll 12s linear infinite}
@keyframes spaceScroll{to{background-position:0 194px,13px 149px}}
.game .particles{z-index:5}.score{color:#95ffb5;font-size:14px;text-shadow:0 0 6px #72ffbc55}
.game.has-art{background:linear-gradient(145deg,rgba(5,14,35,.89),rgba(14,16,49,.83)),var(--astro-bg) center/cover}
@media(prefers-reduced-motion:reduce){.arcade-ship,.hud-stars{animation:none!important}}

</style></head>
<body><main id="root" aria-label="Jogo AstroQuiz"></main>
<script>
"use strict";
const root=document.querySelector("#root");
const post=(type,data={})=>window.parent.postMessage({isStreamlitMessage:true,type,...data},"*");
let height=0;
function resize(){const stage=root.querySelector(".game");if(stage&&!stage.querySelector(".hud-stars")){const layer=document.createElement("div");layer.className="hud-stars";layer.setAttribute("aria-hidden","true");stage.prepend(layer);}if(cfg && typeof cfg.background==="string" && cfg.background.startsWith("data:image/webp;base64,")){root.style.setProperty("--astro-bg", 'url("'+cfg.background+'")');const panel=root.querySelector(".game");if(panel)panel.classList.add("has-art");}const h=Math.ceil(root.getBoundingClientRect().height)+4;if(h!==height){height=h;post("streamlit:setFrameHeight",{height:h});}}
if(window.ResizeObserver)new ResizeObserver(resize).observe(root);
window.addEventListener("resize",resize);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let cfg=null,activeRound=null,idx=0,answers=[],phase="intro",deadline=0,ticker=null,countdown=null,warning=false,sound=true,audio=null,startedAt=0;
function unlock(){if(!sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume().catch(()=>{});}catch(e){}}
function tune(kind){if(!sound||!audio||audio.state!=="running")return;
 const patterns={begin:[[392,0,.10],[523,.13,.12],[659,.27,.17]],tick:[[540,0,.07]],ok:[[523,0,.12],[659,.12,.12],[784,.24,.22]],no:[[300,0,.15],[210,.16,.22]],timeout:[[440,0,.12],[320,.15,.12],[180,.3,.23]],click:[[470,0,.07]],end:[[392,0,.12],[523,.12,.12],[659,.25,.12],[880,.38,.3]]};
 const start=audio.currentTime;
 (patterns[kind]||patterns.click).forEach(([freq,delay,duration])=>{const o=audio.createOscillator(),g=audio.createGain(),t=start+delay;o.type="sine";o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.075,t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+duration+.02);});}
function soundButton(){return '<button class="sound" id="sound" type="button" aria-pressed="'+sound+'">'+(sound?"Som ligado":"Som desligado")+'</button>'}
function wireSound(){const b=document.querySelector("#sound");if(b)b.onclick=()=>{sound=!sound;unlock();if(sound)tune("click");b.textContent=sound?"Som ligado":"Som desligado";b.setAttribute("aria-pressed",String(sound));};}
function clearTimers(){clearInterval(ticker);clearInterval(countdown);ticker=null;countdown=null;}
function intro(){phase="intro";root.innerHTML='<div class="game"><div class="top"><span class="tag">Preparar lançamento · Nível '+esc(cfg.level)+'</span>'+soundButton()+'</div><div class="intro"><div class="orbital"><div class="planet"></div><div class="satellite"></div><div class="arcade-ship"></div></div><h1>PREPARAR LANÇAMENTO</h1><p>'+cfg.questions.length+' perguntas · '+(cfg.duration?cfg.duration+' segundos por pergunta':'sem limite de tempo')+'. O cronômetro começa após a contagem regressiva.</p><button class="primary" id="launch">Iniciar missão e ativar som</button></div><div class="footer"><button class="exit" id="exit">Voltar</button></div></div>';wireSound();document.querySelector("#launch").onclick=()=>{unlock();launch();};document.querySelector("#exit").onclick=exit;resize();}
function launch(){phase="countdown";let n=3;clearTimers();function draw(){root.innerHTML='<div class="game"><div class="intro"><div class="tag" style="color:#c9b9fa">Contagem regressiva</div><div class="count">'+n+'</div><p>Preparando sua missão...</p></div></div>';tune("tick");resize();}draw();countdown=setInterval(()=>{n--;if(n>0)draw();else{clearInterval(countdown);tune("begin");showQuestion();}},1000);}
function exit(){clearTimers();phase="finished";post("streamlit:setComponentValue",{value:{round:activeRound,action:"exit"},dataType:"json"});}
function timeText(seconds){return String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");}
function showQuestion(){clearTimers();phase="question";warning=false;startedAt=performance.now();deadline=startedAt+cfg.duration*1000;
 const q=cfg.questions[idx],letters="ABCD";
 const markers=cfg.questions.map((_,i)=>{let cls=i===idx?"current":"";if(i<answers.length)cls=cfg.mode==="Treino comentado"?(answers[i].option===cfg.questions[i].correct?"correct":"wrong"):"done";return '<i class="'+cls+'"></i>';}).join("");
 root.innerHTML='<div class="game" style="position:relative"><div class="top"><span class="tag">Questão '+(idx+1)+' de '+cfg.questions.length+' · '+esc(q.topic)+'</span>'+soundButton()+'</div><div class="steps">'+markers+'</div>'+(cfg.duration?'<div class="meter" id="meter"><div class="rail" role="progressbar" aria-label="Tempo restante" aria-valuemin="0" aria-valuemax="'+cfg.duration+'" aria-valuenow="'+cfg.duration+'"><div class="fill" id="fill"></div></div><div class="time" id="time">'+timeText(cfg.duration)+'</div></div>':'<p class="small">Modo sem limite de tempo</p>')+'<div class="question"><h2>'+esc(q.prompt)+'</h2><div class="options">'+q.opts.map((item,i)=>'<button type="button" class="option" data-i="'+i+'"><span class="letter">'+letters[i]+'</span><span>'+esc(item)+'</span></button>').join("")+'</div><div id="feedback" aria-live="polite"></div></div><div class="footer"><span class="small">Nível '+esc(cfg.level)+' · '+esc(cfg.mode)+'</span><span class="score" id="score">'+(cfg.mode==="Treino comentado"?answers.filter((a,i)=>a.option===cfg.questions[i].correct).length+" acertos":"Simulado")+'</span><button class="exit" id="exit">Encerrar</button></div><div id="particles" class="particles"></div></div>';
 wireSound();root.querySelectorAll(".option").forEach(b=>b.onclick=()=>{unlock();const value=q.opts[Number(b.dataset.i)];if(cfg.duration&&performance.now()>=deadline)finishAnswer(null);else finishAnswer(value);});document.querySelector("#exit").onclick=exit;
 let lastSecond=-1;
 if(cfg.duration){ticker=setInterval(()=>{if(phase!=="question")return;const remaining=Math.max(0,deadline-performance.now()),seconds=Math.ceil(remaining/1000);
  document.querySelector("#fill").style.width=(100*remaining/(cfg.duration*1000))+"%";
  const rail=document.querySelector(".rail");if(seconds!==lastSecond){document.querySelector("#time").textContent=timeText(seconds);rail.setAttribute("aria-valuenow",String(seconds));if(seconds>0&&seconds<=5)tune("tick");lastSecond=seconds;}
  if(seconds<=8)document.querySelector("#meter").classList.add("urgent");
  if(remaining<=0)finishAnswer(null);
 },80);}
 resize();}
function sparks(){if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;let p=document.querySelector("#particles");for(let i=0;i<24;i++){const e=document.createElement("i");e.className="spark";const a=i*Math.PI/12,r=75+Math.random()*120;e.style.setProperty("--x",Math.cos(a)*r+"px");e.style.setProperty("--y",Math.sin(a)*r+"px");e.style.background=["#a78af5","#2c9b6c","#ffcd7b"][i%3];p.append(e);}setTimeout(()=>p.replaceChildren(),800);}
function finishAnswer(option){if(phase!=="question")return;phase="feedback";clearInterval(ticker);ticker=null;
 const q=cfg.questions[idx],correct=option===q.correct,expired=option===null,training=cfg.mode==="Treino comentado";
 const elapsed=Math.max(0,Math.round((performance.now()-startedAt)/1000));answers.push({option,elapsed:cfg.duration?Math.min(cfg.duration,elapsed):elapsed});
 if(expired&&cfg.duration){document.querySelector("#fill").style.width="0%";document.querySelector("#time").textContent="00:00";document.querySelector(".rail").setAttribute("aria-valuenow","0");}
 if(cfg.duration)document.querySelector("#meter").classList.remove("urgent");
 root.querySelectorAll(".option").forEach((b,i)=>{b.disabled=true;const value=q.opts[i];if(training&&value===q.correct)b.classList.add("good");else if(training&&value===option)b.classList.add("bad");else if(!training&&value===option)b.classList.add("selected");else b.classList.add("dim");});
 if(expired)tune("timeout");else if(training){tune(correct?"ok":"no");if(correct)sparks();}else tune("click");
 const title=expired?"Tempo esgotado!":training?(correct?"Resposta certa!":"Não foi dessa vez."):"Resposta registrada.";
 const text=training?q.explanation:expired?"Questão contabilizada como não respondida.":"O gabarito será apresentado ao final do simulado.";
 document.querySelector("#feedback").innerHTML='<div class="feedback"><strong>'+esc(title)+'</strong>'+esc(text)+'</div><button class="primary" id="next">'+(idx+1===cfg.questions.length?"Concluir missão":"Próxima questão →")+'</button>';
 if(training)document.querySelector("#score").textContent=answers.filter((a,i)=>a.option===cfg.questions[i].correct).length+" acertos";
 document.querySelector("#next").onclick=()=>{unlock();if(idx+1===cfg.questions.length){phase="finished";tune("end");document.querySelector("#next").disabled=true;document.querySelector("#next").textContent="Calculando resultado...";setTimeout(()=>post("streamlit:setComponentValue",{value:{round:activeRound,action:"complete",answers},dataType:"json"}),650);}else{idx++;showQuestion();}};resize();}
window.addEventListener("message",e=>{if(e.source!==window.parent||!e.data||e.data.type!=="streamlit:render")return;const a=e.data.args;if(!a||!Array.isArray(a.questions))return;if(a.round!==activeRound){clearTimers();cfg=a;activeRound=a.round;idx=0;answers=[];intro();}else resize();});
post("streamlit:componentReady",{apiVersion:1});resize();
</script></body></html>
