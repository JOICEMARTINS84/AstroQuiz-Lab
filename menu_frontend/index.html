<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;color:#eff7ff;background:transparent}button,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid white;outline-offset:3px}.screen{position:relative;isolation:isolate;border:1px solid #4c76a4;overflow:hidden;background:#030712;border-radius:12px;min-height:570px;box-shadow:inset 0 0 42px #000}.scene{position:absolute;inset:0;width:100%;height:100%;z-index:-2}.screen:after{position:absolute;inset:0;background:linear-gradient(90deg,#030713f2 0%,#071021df 39%,#05092125 78%);content:"";z-index:-1;pointer-events:none}.top{padding:20px 28px;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #58729b45;font:700 11px system-ui;letter-spacing:.17em;color:#9bbad8}.content{padding:26px 30px 36px;max-width:570px}.eyebrow{color:#76caff;font-size:12px;letter-spacing:.24em;font-weight:800}.logo{font-size:clamp(43px,7vw,84px);font-weight:950;font-style:italic;line-height:1.03;letter-spacing:-.075em;text-shadow:0 3px 0 #0a1b48,0 0 30px #83c7ff66;margin:9px 0}.logo span{color:#93ddff}.sub{color:#b8cce1;font-size:14px;line-height:1.6;margin-bottom:24px}.menu{display:grid;gap:10px;max-width:440px}.menu button,.levels button{position:relative;text-align:left;padding:12px 17px 12px 23px;background:linear-gradient(100deg,#112b49e8,#0a1428d9);border:1px solid #4f789f;border-left:3px solid #6bcfff;border-radius:3px;min-height:64px;box-shadow:0 4px 10px #0005;transition:transform .13s,background .13s}.menu button:hover,.menu button:focus-visible,.levels button:hover,.levels button:focus-visible,.levels button[aria-pressed=true]{transform:translateX(5px);background:linear-gradient(90deg,#1c5fac,#253d6a);border-color:#a1edff;box-shadow:0 0 22px #48c2ff50}.menu button strong,.levels button strong{display:block;font-size:16px;text-transform:uppercase;letter-spacing:.07em}.menu small,.levels small{display:block;font-size:12px;color:#c9d9ee;font-weight:500;margin-top:4px;letter-spacing:0}.menu button .arrow{float:right;font-size:20px;color:#b1edff}.status{display:flex;align-items:center;gap:7px;font-size:11px;color:#adc6e0;margin-top:20px;letter-spacing:.06em}.led{width:7px;height:7px;border-radius:50%;background:#6cf8b7;box-shadow:0 0 9px #6cf8b7}.levels{display:grid;grid-template-columns:1fr 1fr;gap:8px}.levels button{min-height:54px;padding:10px 11px;border-left-width:2px}.levels button strong{font-size:13px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:15px 0}.settings label{font-size:11px;color:#a9ccf2;font-weight:800;letter-spacing:.07em;display:grid;gap:5px}.settings select{width:100%;background:#101d33;border:1px solid #547c9f;border-radius:4px;padding:10px 5px;font-size:13px}.launch{display:block;width:100%;border:1px solid #9beaff;background:linear-gradient(110deg,#215aba,#5067cf);box-shadow:0 0 18px #528dfb50;border-radius:4px;font-weight:900;font-size:15px;letter-spacing:.10em;min-height:52px}.back{background:none;border:0;color:#b8ddff;padding:0 0 15px;text-decoration:underline;font-size:13px}.heading{font-size:28px;font-weight:900;margin:3px 0 10px;letter-spacing:-.03em}.note{font-size:12px;color:#b8cce0;line-height:1.55;margin:12px 0 0}.footer{position:absolute;right:20px;bottom:17px;color:#99b9d5;font-size:10px;letter-spacing:.11em}.sound{border:1px solid #547e9e;border-radius:3px;background:#0c1a2b;padding:6px 9px;font-size:11px}.screen[data-busy=true] button{pointer-events:none;opacity:.65}@media(max-width:660px){.screen{min-height:610px}.screen:after{background:linear-gradient(90deg,#050918f2,#050919c8 52%,#080b2044)}.top{padding:12px 13px;font-size:10px}.content{padding:24px 17px 39px}.logo{font-size:52px}.footer{right:13px;bottom:10px}.levels button strong{font-size:12px}}@media(prefers-reduced-motion:reduce){button{transition:none}}
</style></head>
<body><main class="screen" id="screen"><canvas id="scene" class="scene" aria-hidden="true"></canvas><div class="top"><span>ASTROQUIZ / TERMINAL DE MISSÕES</span><button class="sound" id="sound">SOM: ON</button></div><section id="content" class="content"></section></main>
<script>
"use strict";
const root=document.querySelector("#screen"),content=document.querySelector("#content"),canvas=document.querySelector("#scene"),ctx=canvas.getContext("2d");
const post=(type,data={})=>parent.postMessage({isStreamlitMessage:true,type,...data},"*");
let oldHeight=0,mode="main",level=3,round=0,ready=false,sound=true,audio=null,total=80,science=17;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function resize(){const h=Math.ceil(root.getBoundingClientRect().height)+4;if(h!==oldHeight){oldHeight=h;post("streamlit:setFrameHeight",{height:h})}const b=root.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.floor(b.width*d)||canvas.height!==Math.floor(b.height*d)){canvas.width=Math.floor(b.width*d);canvas.height=Math.floor(b.height*d);}}
new ResizeObserver(resize).observe(root);
function beep(start=false){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume().then(()=>{let t=audio.currentTime;const frequencies=start?[392,587,784]:[540];frequencies.forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type="sine";o.frequency.value=f;let s=t+i*.085;g.gain.setValueAtTime(.055,s);g.gain.exponentialRampToValueAtTime(.0001,s+.13);o.connect(g).connect(audio.destination);o.start(s);o.stop(s+.14);});}).catch(()=>{});}catch(e){}}
document.querySelector("#sound").onclick=()=>{sound=!sound;document.querySelector("#sound").textContent="SOM: "+(sound?"ON":"OFF");beep()};
function send(action,extra={}){if(root.dataset.busy==="true")return;root.dataset.busy="true";beep(true);setTimeout(()=>post("streamlit:setComponentValue",{value:{round,action,...extra},dataType:"json"}),180)}
function main(){mode="main";content.innerHTML='<div class="eyebrow">INICIAR JOGO</div><h1 class="logo">ASTRO<span>QUIZ</span></h1><div class="sub">Olimpíada Brasileira de Astronomia e Astronáutica<br>Treinamento independente · '+total+' questões escolares</div><div class="menu"><button id="oba"><span class="arrow">›</span><strong>Campanha OBA</strong><small>4 níveis · 10 questões por missão</small></button><button id="arcade"><span class="arrow">›</span><strong>Astro Arcade</strong><small>Space Shooter · Cinturão de Asteroides</small></button><button id="science"><span class="arrow">›</span><strong>Desafio científico</strong><small>'+science+' questões avançadas em português</small></button></div><div class="status"><span class="led"></span> SISTEMA PRONTO · SELECIONE UMA MISSÃO</div>';document.querySelector("#oba").onclick=()=>{beep();setup(false)};document.querySelector("#science").onclick=()=>{beep();setup(true)};document.querySelector("#arcade").onclick=()=>send("arcade");resize();}
function setup(isScience){mode=isScience?"science":"oba";level=isScience?5:(level===5?3:level);const names=["1º ao 3º ano","4º e 5º ano","6º ao 9º ano","Ensino Médio"];content.innerHTML='<button class="back" id="back">‹ MENU PRINCIPAL</button><div class="eyebrow">CONFIGURAR MISSÃO</div><h2 class="heading">'+(isScience?"Desafio científico":"Campanha OBA")+'</h2>'+(isScience?'<div class="note">Astronomia e engenharia espacial — nível avançado.</div>':'<div class="levels">'+names.map((n,i)=>'<button data-level="'+(i+1)+'" aria-pressed="'+(level===i+1)+'"><strong>Nível '+(i+1)+'</strong><small>'+n+'</small></button>').join("")+'</div>')+'<div class="settings"><label>MODO DE JOGO<select id="quizmode"><option>Treino comentado</option><option>Simulado</option></select></label><label>TEMPO POR QUESTÃO<select id="duration"><option value="30">30 segundos</option><option value="45">45 segundos</option><option selected value="60">60 segundos</option><option value="90">90 segundos</option><option value="120">120 segundos</option><option value="0">Sem limite</option></select></label></div><button class="launch" id="go">INICIAR MISSÃO</button><p class="note">'+(isScience?"Questões traduzidas e adaptadas do Astro-MCQ.":"Treino com questões originais e exercícios relacionados aos gabaritos OBA 2025. 7 de astronomia e 3 de astronáutica.")+'</p>';document.querySelector("#back").onclick=()=>{beep();main()};content.querySelectorAll("[data-level]").forEach(b=>{b.onclick=()=>{level=Number(b.dataset.level);beep();content.querySelectorAll("[data-level]").forEach(el=>el.setAttribute("aria-pressed",String(Number(el.dataset.level)===level)))}});document.querySelector("#go").onclick=()=>send("quiz",{level,mode:document.querySelector("#quizmode").value,duration:Number(document.querySelector("#duration").value),sound});resize()}
const stars=Array.from({length:145},()=>({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random()*.95+.05}));
let start=performance.now(),last=start;
const shipVertices=[[0,0,2],[-.26,.17,-.2],[.26,.17,-.2],[-.32,-.18,-.25],[.32,-.18,-.25],[-1.18,-.12,-.65],[1.18,-.12,-.65],[-.43,-.22,-1.13],[.43,-.22,-1.13],[0,.34,-.75],[0,-.27,-.86]];
const faces=[[[0,1,9,2],"#b2c9dd"],[[0,3,1],"#45658c"],[[0,2,4],"#7a9fc2"],[[1,5,7,9],"#6684a9"],[[2,9,8,6],"#9cbed8"],[[3,7,5],"#274168"],[[4,6,8],"#3c638e"],[[0,4,10,3],"#394961"],[[7,10,8,9],"#416183"],[[1,2,9],"#183854"]];
function drawShip(x,y,s,t){let angle=t*.55+.7,ca=Math.cos(angle),sa=Math.sin(angle),tilt=.27,ct=Math.cos(tilt),st=Math.sin(tilt);let pts=shipVertices.map(([a,b,c])=>{let u=a*ca+c*sa,z=-a*sa+c*ca,v=b*ct-z*st,depth=b*st+z*ct,f=5/(5+depth);return [x+u*s*f,y+v*s*f,depth]});let order=faces.map(([indices,col])=>({indices,col,depth:indices.reduce((v,i)=>v+pts[i][2],0)/indices.length})).sort((a,b)=>b.depth-a.depth);for(const face of order){ctx.beginPath();face.indices.forEach((v,i)=>i?ctx.lineTo(pts[v][0],pts[v][1]):ctx.moveTo(pts[v][0],pts[v][1]));ctx.closePath();ctx.fillStyle=face.col;ctx.fill();ctx.strokeStyle="#263d5c";ctx.lineWidth=.8;ctx.stroke();}let back=pts[10];ctx.shadowBlur=s*.35;ctx.shadowColor="#45c6ff";ctx.fillStyle="#b5f2ff";ctx.beginPath();ctx.ellipse(back[0],back[1],s*.09,s*.05,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
function draw(now){let w=canvas.width,h=canvas.height;if(!w||!h){requestAnimationFrame(draw);return}let dt=reduce?0:Math.min(.04,(now-last)/1000),t=reduce?0:(now-start)/1000;last=now;ctx.fillStyle="#020613";ctx.fillRect(0,0,w,h);let neb=ctx.createRadialGradient(w*.8,h*.46,0,w*.8,h*.46,w*.55);neb.addColorStop(0,"#263974");neb.addColorStop(.45,"#161f46");neb.addColorStop(1,"#030714");ctx.fillStyle=neb;ctx.fillRect(0,0,w,h);let cx=w*.74,cy=h*.46;
for(const p of stars){p.z-=dt*.105;if(p.z<.05){p.z=1;p.x=Math.random()*2-1;p.y=Math.random()*2-1}let sx=cx+p.x*w*.48/p.z,sy=cy+p.y*h*.55/p.z;ctx.fillStyle="rgba(195,226,255,"+Math.min(.9,1-p.z+.15)+")";ctx.beginPath();ctx.arc(sx,sy,.45+1.65*(1-p.z),0,Math.PI*2);ctx.fill()}
let R=Math.min(h*.29,w*.245),px=w*.83,py=h*.40;
ctx.save();ctx.translate(px,py);ctx.rotate(-.27);ctx.strokeStyle="#8ba0c34c";ctx.lineWidth=R*.07;ctx.beginPath();ctx.ellipse(0,0,R*1.66,R*.36,0,0,2*Math.PI);ctx.stroke();ctx.restore();
let grad=ctx.createRadialGradient(px-R*.38,py-R*.47,R*.07,px,py,R);grad.addColorStop(0,"#c4d7e5");grad.addColorStop(.4,"#7f9bb7");grad.addColorStop(.72,"#304d80");grad.addColorStop(1,"#101b3b");ctx.beginPath();ctx.arc(px,py,R,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();ctx.save();ctx.clip();for(let i=0;i<7;i++){ctx.strokeStyle=i%2?"#b7d8f02a":"#0e1a4933";ctx.lineWidth=R*.09;ctx.beginPath();ctx.ellipse(px+R*.06,py-R*.64+i*R*.22,R*1.13,R*.24,-.23,0,Math.PI*2);ctx.stroke();}ctx.restore();ctx.save();ctx.translate(px,py);ctx.rotate(-.27);ctx.strokeStyle="#b3c6e580";ctx.lineWidth=R*.08;ctx.beginPath();ctx.ellipse(0,0,R*1.66,R*.36,0,0,Math.PI);ctx.stroke();ctx.restore();
drawShip(w*.78+Math.sin(t*.8)*w*.035,h*.70+Math.sin(t*1.5)*h*.025,Math.min(w*.14,h*.20),t);requestAnimationFrame(draw)}
window.addEventListener("message",e=>{if(e.source!==parent||e.data?.type!=="streamlit:render")return;let a=e.data.args||{};if(!ready||a.round!==round){ready=true;round=a.round;total=a.oba_count||80;science=a.science_count||17;root.dataset.busy="false";main()}resize()});
main();post("streamlit:componentReady",{apiVersion:1});resize();requestAnimationFrame(draw)
</script></body></html>
