<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astro Arcade</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#e8f5ff;font-family:system-ui,Arial,sans-serif;background:transparent}.shell{max-width:760px;margin:0 auto;padding:9px;border-radius:20px;background:linear-gradient(135deg,#071128,#151333);border:1px solid #4175ac;box-shadow:inset 0 0 30px #1d4c8b55}.top,.controls{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:7px}.title{letter-spacing:.15em;font-size:12px;color:#8bdfff;font-weight:800}.canvas-wrap{position:relative;max-width:560px;margin:auto;overflow:hidden;border:1px solid #3763a1;border-radius:13px;background:#03071a}canvas{display:block;width:100%;height:auto;touch-action:none;outline:none}.overlay{position:absolute;inset:0;background:#040a1ad9;display:grid;place-content:center;text-align:center;padding:24px;backdrop-filter:blur(3px)}.overlay[hidden]{display:none}.overlay h1{font-size:clamp(27px,5vw,43px);margin:8px 0;line-height:1.08;color:#e4f6ff;text-shadow:0 0 26px #53c8ff}.overlay p{color:#b6c8e6;line-height:1.5;font-size:15px;max-width:390px;margin:12px auto}button{font:inherit;font-weight:700;cursor:pointer;border-radius:9px;border:1px solid #457db4;background:#132951;color:#e7faff;padding:10px 15px;touch-action:none}button:focus-visible{outline:3px solid #7cecff;outline-offset:2px}button:hover{border-color:#8deaff;background:#254773}.play{padding:14px 24px;background:linear-gradient(110deg,#1268c8,#774ce3);border-color:#8ee7ff;box-shadow:0 0 22px #605fff55;margin:auto}.controls{max-width:565px;margin:auto;justify-content:center}.controls button{min-height:43px;min-width:46px}.fire{background:#563188;border-color:#b993ff}.help{text-align:center;color:#a1b6d3;font-size:12px;margin:7px}.hudtag{font-size:12px;color:#a5b7d4}.mobile{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}@media(max-width:420px){.top button{padding:7px 9px;font-size:12px}.controls button{padding:8px 10px}.shell{padding:5px}}
.menu-return{background:#1f324c;border-color:#6588aa;color:#d6ebff}.overlay-return{display:block;width:100%;max-width:320px;margin:12px auto 0;font-size:13px;min-height:42px}.top>div{display:flex;flex-wrap:wrap;gap:6px}.top button{min-height:38px}.overlay-return:hover,.menu-return:hover{background:#294665;border-color:#b4eaff}@media(max-width:420px){.top>div{width:100%}.top button{flex:1;white-space:nowrap}}</style>
<div class="shell" id="shell"><div class="top"><span class="title" id="gameTitle">ASTRO ARCADE</span><div><button id="mute">Som ligado</button> <button id="pause">Pausar</button> <button id="exitArcade" class="menu-return">Voltar ao menu</button></div></div><div class="canvas-wrap"><canvas id="cv" width="480" height="610" tabindex="0" aria-label="Campo de jogo espacial"></canvas><div class="overlay" id="overlay"><div><div class="title">ASTRO ARCADE</div><h1 id="heading">Space Shooter</h1><p id="description"></p><button class="play" id="start">JOGAR</button><button class="menu-return overlay-return" id="leaveArcade">Voltar ao menu principal</button></div></div></div><div class="controls"><div class="mobile"><button data-key="ArrowLeft" aria-label="Esquerda">←</button><button data-key="ArrowUp" aria-label="Cima">↑</button><button data-key="ArrowDown" aria-label="Baixo">↓</button><button data-key="ArrowRight" aria-label="Direita">→</button><button class="fire" data-key="Space" id="fire">LASER</button><button id="bomb">PULSO</button></div></div><p class="help" id="help"></p></div>
<script>
"use strict";
const $=id=>document.getElementById(id),c=$("cv"),g=c.getContext("2d"),W=c.width,H=c.height;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),hit=(a,b,r)=>Math.hypot(a.x-b.x,a.y-b.y)<r;
const keys=new Set(),stars=Array.from({length:100},()=>({x:rand(0,W),y:rand(0,H),v:rand(20,130),r:rand(.5,1.8)}));
let mode="shooter",state="menu",sound=true,ac=null,score=0,best=0,level=1,lives=3,pulses=2,shield=0,weapon=1,rapid=0,combo=0,comboTime=0,elapsed=0,spawn=0,shot=0,inv=0,phaseTime=0,remaining=12,boss=null,player={x:W/2,y:H-65},enemies=[],shots=[],threats=[],power=[],particles=[],pointer=null;
let last=performance.now(),frame=0,configured=false,arcadeRound=0;
const bridge=(type,data={})=>parent.postMessage({isStreamlitMessage:true,type,...data},"*");
let lastH=0;function resize(){let height=Math.ceil($("shell").getBoundingClientRect().height)+5;if(height!==lastH){lastH=height;bridge("streamlit:setFrameHeight",{height});}}new ResizeObserver(resize).observe($("shell"));
function unlock(){if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume().catch(()=>{});}catch(e){}}
function beep(type){if(!sound||!ac||ac.state!=="running")return;const map={shoot:[710,340,.065,.035,"triangle"],hit:[190,70,.09,.06,"triangle"],boom:[145,45,.24,.09,"sawtooth"],power:[390,1050,.21,.07,"sine"],hurt:[220,65,.3,.09,"square"],start:[240,830,.24,.08,"sine"],boss:[150,80,.5,.08,"triangle"],end:[300,90,.45,.06,"sine"]};let [a,b,d,v,k]=map[type]||map.hit;let o=ac.createOscillator(),n=ac.createGain(),t=ac.currentTime;o.type=k;o.frequency.setValueAtTime(a,t);o.frequency.exponentialRampToValueAtTime(b,t+d);n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(n).connect(ac.destination);o.start();o.stop(t+d);}
function store(){try{localStorage.setItem("astroarcade-"+mode,String(best))}catch(e){}}
function load(){try{return Number(localStorage.getItem("astroarcade-"+mode))||0}catch(e){return 0}}
function menu(){state="menu";$("overlay").hidden=false;$("heading").textContent=mode==="shooter"?"SPACE SHOOTER":"CINTURÃO DE ASTEROIDES";$("description").textContent=mode==="shooter"?"Pilote sua nave, destrua drones e asteroides, recolha melhorias e enfrente os chefes a cada cinco fases.":"Atravesse o campo de asteroides, recolha cristais de amostra e use o escudo para sobreviver. Quanto mais tempo, mais difícil.";$("start").textContent="JOGAR";$("gameTitle").textContent=mode==="shooter"?"ARCADE / SPACE SHOOTER":"ARCADE / CINTURÃO";$("help").textContent=mode==="shooter"?"Setas ou WASD · Espaço: laser · B/X: pulso · P/Esc: pausa · Arraste a nave no celular":"Setas ou WASD · B/X: pulso de proteção · P/Esc: pausa · Arraste a nave no celular";$("fire").hidden=mode!=="shooter";$("pause").textContent="Pausar";resize();}
function start(){unlock();state="play";score=0;level=1;lives=3;pulses=2;shield=0;weapon=1;rapid=0;combo=0;comboTime=0;elapsed=0;spawn=.55;shot=0;inv=1.5;phaseTime=1.8;remaining=12;boss=null;player={x:W/2,y:H-65};enemies=[];shots=[];threats=[];power=[];particles=[];keys.clear();pointer=null;$("overlay").hidden=true;$("pause").textContent="Pausar";c.focus({preventScroll:true});beep("start");}
function pause(){if(state==="play"){state="paused";keys.clear();pointer=null;$("overlay").hidden=false;$("heading").textContent="PAUSADO";$("description").textContent="Sua missão continua quando você estiver pronto.";$("start").textContent="CONTINUAR";$("pause").textContent="Continuar"}else if(state==="paused"){state="play";$("overlay").hidden=true;$("pause").textContent="Pausar";c.focus({preventScroll:true});}}
function exitArcade(){if(state==="exiting")return;best=Math.max(best,score);store();state="exiting";keys.clear();pointer=null;cancelAnimationFrame(frame);$("start").disabled=true;$("leaveArcade").disabled=true;$("exitArcade").disabled=true;$("overlay").hidden=false;$("heading").textContent="VOLTANDO AO MENU";$("description").textContent="A missão foi encerrada.";bridge("streamlit:setComponentValue",{value:{action:"exit",round:arcadeRound},dataType:"json"});}
function requestExit(){if(state==="play"){pause();$("heading").textContent="VOLTAR AO MENU?";$("description").textContent="A partida atual será encerrada. Você pode continuar ou voltar ao menu principal.";}else if(state!=="exiting"){exitArcade();}}
function finish(){state="over";best=Math.max(score,best);store();$("overlay").hidden=false;$("heading").textContent="FIM DA MISSÃO";$("description").textContent="Pontos: "+score.toLocaleString("pt-BR")+" · Fase: "+level+" · Recorde: "+best.toLocaleString("pt-BR");$("start").textContent="JOGAR NOVAMENTE";beep("end");}
function burst(x,y,color,n=20){for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),v=rand(30,230);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.25,.7),color,r:rand(1,4)})}if(particles.length>450)particles.splice(0,particles.length-450);}
function points(n){combo++;comboTime=2.5;score+=n*(1+Math.min(4,Math.floor(combo/4)));if(score>best){best=score;}}
function hurt(){if(inv>0)return;if(shield>0){shield=0;inv=1;beep("hit");return;}lives--;combo=0;weapon=Math.max(1,weapon-1);inv=2;burst(player.x,player.y,"#ca95ff",28);beep("hurt");if(lives<=0)finish();}
function drop(x,y,kind){power.push({x,y,r:12,kind:kind||["W","S","R","B","H"][Math.floor(rand(0,5))]});}
function destroy(e){e.dead=true;points(e.kind==="tank"?60:e.kind==="rock"?20:30);burst(e.x,e.y,e.color);beep("boom");if(Math.random()<.19)drop(e.x,e.y);}
function next(){level++;phaseTime=2;spawn=1.4;remaining=10+level*3;if(mode==="shooter"&&level%5===0){remaining=0;boss={x:W/2,y:-80,r:37,hp:28+level*4,max:28+level*4,t:0,fire:1.5};beep("boss");}else beep("power");}
function newEnemy(){let kind=mode==="dodge"?"rock":(Math.random()<.38?"rock":level>3&&Math.random()<.28?"tank":level>1&&Math.random()<.45?"zig":"drone"),r=kind==="rock"?rand(15,28):kind==="tank"?24:16,x=rand(r+8,W-r-8);return {kind,x,y:-r-8,base:x,r,hp:kind==="tank"?4:kind==="rock"?2:1,color:kind==="rock"?"#9b9bd7":kind==="tank"?"#f26bdf":"#ff7494",v:rand(65,120)+Math.min(150,level*12),t:rand(0,7),spin:rand(-2,2),drift:rand(-25,25),fire:rand(1.4,3.2),shape:Array.from({length:9},()=>rand(.75,1.15))};}
function shoot(){let offsets=weapon===1?[0]:weapon===2?[-.08,.08]:weapon===3?[-.2,0,.2]:[-.3,-.13,0,.13,.3];for(let a of offsets)shots.push({x:player.x,y:player.y-23,vx:Math.sin(a)*650,vy:-Math.cos(a)*650,r:3});beep("shoot");}
function pulse(){if(state!=="play"||pulses<=0)return;unlock();pulses--;burst(player.x,player.y,"#60dcff",65);beep("power");shield=Math.max(shield,4);threats=[];if(mode==="shooter"){for(let e of enemies)if(!e.dead)destroy(e);if(boss)boss.hp-=12;}else{for(let e of enemies)if(hit(e,player,135))e.dead=true;}}
function update(dt){for(let s of stars){s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=rand(0,W)}}for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(state!=="play")return;
 elapsed+=dt;phaseTime=Math.max(0,phaseTime-dt);inv=Math.max(0,inv-dt);shield=Math.max(0,shield-dt);rapid=Math.max(0,rapid-dt);comboTime-=dt;if(comboTime<=0)combo=0;let dx=Number(keys.has("ArrowRight")||keys.has("KeyD"))-Number(keys.has("ArrowLeft")||keys.has("KeyA")),dy=Number(keys.has("ArrowDown")||keys.has("KeyS"))-Number(keys.has("ArrowUp")||keys.has("KeyW")),len=Math.hypot(dx,dy)||1;player.x=clamp(player.x+dx*330*dt/len,20,W-20);player.y=clamp(player.y+dy*330*dt/len,105,H-28);if(pointer){player.x=clamp(pointer.x,20,W-20);player.y=clamp(pointer.y,105,H-28);}
 shot-=dt;if(mode==="shooter"&&(keys.has("Space")||pointer)&&shot<=0){shoot();shot=rapid>0?.10:.19;}if(Math.random()<.65)particles.push({x:player.x+rand(-4,4),y:player.y+18,vx:rand(-15,15),vy:rand(70,180),life:.22,color:"#61ceff",r:2});
 spawn-=dt;if(spawn<=0&&(mode==="dodge"||remaining>0)){enemies.push(newEnemy());if(mode==="shooter")remaining--;else if(Math.random()<.30)drop(rand(20,W-20),-10,"C");spawn=Math.max(.22,.85-level*.045)*rand(.75,1.3);}
 if(mode==="dodge"&&elapsed>=level*16)next();
 for(let e of enemies){e.t+=dt;e.y+=e.v*dt;if(e.kind==="zig")e.x=clamp(e.base+Math.sin(e.t*3)*65,e.r,W-e.r);else if(e.kind==="rock"){e.x+=e.drift*dt;}else if(e.kind==="tank"){e.fire-=dt;if(e.fire<=0&&e.y>20){e.fire=2.2;for(let a of [-.3,0,.3])threats.push({x:e.x,y:e.y,vx:Math.sin(a)*180,vy:Math.cos(a)*180,r:5});}}}
 if(boss){boss.t+=dt;boss.y=Math.min(112,boss.y+100*dt);boss.x=W/2+Math.sin(boss.t*.9)*(W/2-65);boss.fire-=dt;if(boss.fire<=0&&boss.y>=100){boss.fire=boss.hp<boss.max*.4?.75:1.35;for(let i=0;i<12;i++){let a=i*Math.PI/6+boss.t;threats.push({x:boss.x,y:boss.y,vx:Math.cos(a)*155,vy:Math.sin(a)*155,r:5});}}}
 for(let b of shots){b.x+=b.vx*dt;b.y+=b.vy*dt;for(let e of enemies){if(!e.dead&&!b.dead&&hit(b,e,e.r+3)){b.dead=true;e.hp--;if(e.hp<=0)destroy(e);else{burst(b.x,b.y,e.color,4);beep("hit");}}}if(boss&&!b.dead&&hit(b,boss,boss.r)){b.dead=true;boss.hp--;burst(b.x,b.y,"#ff99db",5);}}
 if(boss&&boss.hp<=0){points(550+level*40);burst(boss.x,boss.y,"#fc7fe4",90);drop(boss.x-25,boss.y,"H");drop(boss.x+25,boss.y,"W");boss=null;threats=[];beep("boom");}
 for(let b of threats){b.x+=b.vx*dt;b.y+=b.vy*dt;if(!b.dead&&hit(b,player,b.r+12)){b.dead=true;hurt();}}
 for(let e of enemies)if(!e.dead&&hit(e,player,e.r+11)){e.dead=true;burst(e.x,e.y,e.color);hurt();}
 if(boss&&hit(boss,player,boss.r+12))hurt();
 for(let p of power){p.y+=95*dt;if(hit(p,player,28)){p.dead=true;beep("power");if(p.kind==="S")shield=8;else if(p.kind==="W")weapon=Math.min(4,weapon+1);else if(p.kind==="R")rapid=8;else if(p.kind==="H")lives=Math.min(5,lives+1);else if(p.kind==="B")pulses=Math.min(5,pulses+1);else points(100);}}
 enemies=enemies.filter(e=>!e.dead&&e.y<H+45&&e.x>-60&&e.x<W+60);shots=shots.filter(b=>!b.dead&&b.y>-15&&b.x>-20&&b.x<W+20);threats=threats.filter(b=>!b.dead&&b.y>-30&&b.y<H+30&&b.x>-30&&b.x<W+30);power=power.filter(p=>!p.dead&&p.y<H+30);
 if(mode==="shooter"&&remaining<=0&&!enemies.length&&!boss&&state==="play"){points(100*level);next();}}
function poly(x,y,pts,col,fill="#111b37"){g.save();g.translate(x,y);g.beginPath();pts.forEach(([a,b],i)=>i?g.lineTo(a,b):g.moveTo(a,b));g.closePath();g.fillStyle=fill;g.fill();g.strokeStyle=col;g.lineWidth=2;g.shadowColor=col;g.shadowBlur=9;g.stroke();g.restore();}
function dot(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}
function text(s,x,y,size=14,color="#c0d6ee",align="left"){g.fillStyle=color;g.font="700 "+size+"px system-ui";g.textAlign=align;g.fillText(s,x,y);}
function draw(){let bg=g.createLinearGradient(0,0,W,H);bg.addColorStop(0,"#03091c");bg.addColorStop(.55,"#11112f");bg.addColorStop(1,"#06172c");g.fillStyle=bg;g.fillRect(0,0,W,H);let n=g.createRadialGradient(390,170,8,390,170,210);n.addColorStop(0,"#56269d55");n.addColorStop(1,"#56269d00");g.fillStyle=n;g.fillRect(0,0,W,H);for(let s of stars)dot(s.x,s.y,s.r,"rgba(190,222,255,"+(.28+s.v/220)+")");
 for(let p of particles){g.globalAlpha=Math.min(1,p.life*3);dot(p.x,p.y,p.r,p.color)}g.globalAlpha=1;
 for(let e of enemies){let pts=e.kind==="rock"?e.shape.map((v,i)=>[Math.cos(e.t*e.spin+i*Math.PI*2/9)*e.r*v,Math.sin(e.t*e.spin+i*Math.PI*2/9)*e.r*v]):e.kind==="tank"?Array.from({length:6},(_,i)=>[Math.cos(i*Math.PI/3)*e.r,Math.sin(i*Math.PI/3)*e.r]):[[-e.r,-e.r],[0,-6],[e.r,-e.r],[0,e.r]];poly(e.x,e.y,pts,e.color);}
 if(boss){poly(boss.x,boss.y,[[-50,-10],[-40,-32],[-14,-18],[14,-18],[40,-32],[50,-10],[29,30],[0,43],[-29,30]],"#ff73ca","#3c164c");dot(boss.x,boss.y,12,"#ff8add");g.fillStyle="#492343";g.fillRect(40,81,W-80,7);g.fillStyle="#ff73ca";g.fillRect(40,81,(W-80)*clamp(boss.hp/boss.max,0,1),7);}
 for(let b of shots){g.strokeStyle="#9aeaff";g.lineWidth=3;g.shadowColor="#5ecbff";g.shadowBlur=10;g.beginPath();g.moveTo(b.x,b.y+13);g.lineTo(b.x,b.y);g.stroke();g.shadowBlur=0;}for(let b of threats)dot(b.x,b.y,b.r,"#ff699c");
 for(let p of power){let color={W:"#ffdc72",S:"#7aeaff",R:"#ffb96a",B:"#e98bff",H:"#6effbc",C:"#66fff0"}[p.kind];poly(p.x,p.y,[[0,-12],[12,0],[0,12],[-12,0]],color,"#113251");text(p.kind,p.x,p.y+4,11,color,"center");}
 if(state!=="over"&&!(inv>0&&Math.floor(inv*9)%2===1)){poly(player.x,player.y,[[0,-25],[8,-8],[22,16],[7,10],[0,17],[-7,10],[-22,16],[-8,-8]],"#8ee8ff","#182a53");dot(player.x,player.y-4,4,"#a7eeff");poly(player.x,player.y,[[ -5,16],[5,16],[0,25+rand(0,8)]],"#ffcd7c","#e88a38");if(shield>0){g.strokeStyle="#65ffe1";g.lineWidth=2;g.beginPath();g.arc(player.x,player.y,31,0,Math.PI*2);g.stroke();}}
 g.fillStyle="#071126de";g.fillRect(0,0,W,70);text("PONTOS",13,20,11);text(score.toLocaleString("pt-BR"),13,46,24,"#e8f6ff");text("FASE "+level,W/2,26,14,"#8edfff","center");text("RECORDE",W-13,20,11,"#b5c7e3","right");text(best.toLocaleString("pt-BR"),W-13,45,19,"#ffdb8b","right");text("VIDAS "+lives,14,64,12,"#8effcc");text("PULSOS "+pulses,W-14,64,12,"#e6aaff","right");if(combo>=4)text("COMBO ×"+(1+Math.min(4,Math.floor(combo/4))),W/2,64,12,"#ffe38a","center");if(phaseTime>0&&state==="play")text(level%5===0&&mode==="shooter"?"CHEFE SE APROXIMANDO":"FASE "+level,W/2,H*.37,25,"#e3eaff","center");
}
function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(state==="exiting")return;if(state!=="paused")update(dt);draw();frame=requestAnimationFrame(loop)}
$("start").onclick=()=>state==="exiting"?null:state==="paused"?pause():start();$("exitArcade").onclick=requestExit;$("leaveArcade").onclick=exitArcade;$("pause").onclick=pause;$("mute").onclick=()=>{sound=!sound;if(sound){unlock();beep("power")}$("mute").textContent=sound?"Som ligado":"Som desligado"};$("bomb").onclick=pulse;
window.addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space","KeyW","KeyA","KeyS","KeyD","KeyB","KeyX","KeyP","Escape","Enter"].includes(e.code)){if(state==="play"||e.target===c)e.preventDefault();keys.add(e.code);if(!e.repeat){if(e.code==="KeyP"||e.code==="Escape")pause();if(e.code==="KeyB"||e.code==="KeyX")pulse();if(e.code==="Enter"&&state!=="play"&&state!=="exiting"&&e.target.tagName!=="BUTTON"){if(state==="paused")pause();else start();}}}});
window.addEventListener("keyup",e=>keys.delete(e.code));window.addEventListener("blur",()=>{keys.clear();pointer=null;if(state==="play")pause()});
document.querySelectorAll("[data-key]").forEach(btn=>{let k=btn.dataset.key;btn.onpointerdown=e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);keys.add(k);unlock()};btn.onpointerup=btn.onpointercancel=btn.onlostpointercapture=()=>keys.delete(k)});
function point(e){let b=c.getBoundingClientRect();pointer={x:(e.clientX-b.left)*W/b.width,y:(e.clientY-b.top)*H/b.height}}
c.onpointerdown=e=>{if(state!=="play")return;e.preventDefault();c.setPointerCapture(e.pointerId);unlock();point(e)};c.onpointermove=e=>{if(pointer)point(e)};c.onpointerup=c.onpointercancel=c.onlostpointercapture=()=>pointer=null;
window.addEventListener("message",e=>{if(e.source!==parent||e.data?.type!=="streamlit:render")return;arcadeRound=e.data.args?.round??0;let m=e.data.args?.mode==="dodge"?"dodge":"shooter";if(!configured||mode!==m){mode=m;best=load();configured=true;menu()}resize()});
menu();bridge("streamlit:componentReady",{apiVersion:1});resize();frame=requestAnimationFrame(loop);
</script></html>
